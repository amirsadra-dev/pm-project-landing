name: Build and Deploy Landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments must not run concurrently: two SSH jobs would build and restart
# the same compose service at the same time. cancel-in-progress is false so a
# newer push waits instead of leaving the server in a half-deployed state.
concurrency:
  group: landing-production
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, build and validate image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Set this as a repository variable (Settings → Secrets and variables →
      # Actions → Variables). CI only validates the build; the production
      # image is rebuilt on the server from its own .env.
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.example.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            -t pm-project-landing:ci .

  deploy:
    name: Deploy to production server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DEPLOY_BRANCH
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            cd /opt/myapp/pm-project-landing
            git fetch origin main
            git reset --hard origin/main

            cd /opt/myapp
            docker compose build landing
            docker compose up -d --no-deps landing

            for i in $(seq 1 12); do
              s=$(docker inspect -f '{{.State.Health.Status}}' myapp-landing-1 2>/dev/null || echo none)
              echo "landing health: $s"
              if [ "$s" = "healthy" ]; then exit 0; fi
              sleep 5
            done
            docker logs --tail=50 myapp-landing-1
            exit 1
