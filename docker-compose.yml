# Production container for the PM Project landing page.
#
#   cp .env.example .env    # set NEXT_PUBLIC_APP_URL (panel address)
#   docker compose up -d --build
#
# The panel URL is a build argument because Next.js inlines NEXT_PUBLIC_*
# values at build time. Publish the port only on localhost when a reverse
# proxy (nginx/Caddy) terminates TLS in front of it.
name: pm-project-landing

services:
  landing:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:5173}"
    image: pm-project-landing:latest
    restart: unless-stopped
    ports:
      - "${LANDING_BIND:-0.0.0.0}:${LANDING_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
